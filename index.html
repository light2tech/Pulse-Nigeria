<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        function isExtensionError(msg, stack, filename) {
          var combined = String(msg || '') + ' ' + String(stack || '') + ' ' + String(filename || '');
          return (
            combined.indexOf('chrome-extension://') !== -1 ||
            combined.indexOf('moz-extension://') !== -1 ||
            combined.indexOf('safari-extension://') !== -1 ||
            combined.indexOf('Failed to connect to MetaMask') !== -1 ||
            combined.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1
          );
        }

        window.addEventListener(
          'error',
          function (event) {
            var err = event.error;
            if (isExtensionError(event.message || (err && err.message), err && err.stack, event.filename)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event.reason;
            var msg = typeof reason === 'string' ? reason : reason && reason.message;
            var stack = reason && reason.stack;
            if (isExtensionError(msg, stack, '')) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
